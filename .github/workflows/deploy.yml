name: Deploy Crawler to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          command_timeout: 10m
          script: |
            set -e

            # GitHub Actions SSH는 non-login shell이라 NVM 경로를 직접 로드해야 한다.
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi

            command -v node
            command -v npm
            command -v pm2

            cd ~/seevar-referee-crawler

            # 1. 최신 코드 pull
            git pull --ff-only origin main
            echo "Deployed commit: $(git rev-parse --short HEAD)"

            # 2. .env 재생성 (Gemini 불필요)
            printf "API_BASE_URL=https://seevar.online\nCRAWLER_API_KEY=${{ secrets.CRAWLER_API_KEY }}\n" > .env

            # 3. 패키지 설치
            npm ci

            # 4. PM2 프로세스 재시작
            pm2 reload ecosystem.config.js --update-env
            pm2 status seevar-crawler

            echo "✅ Crawler deployed successfully"
